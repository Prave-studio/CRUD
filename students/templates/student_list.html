<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Records</title>
</head>
<body>
    <h2>Student Records Management Portal</h2>
    <a href="{% url 'student_create' %}">Add New Student</a>
    <table border="1" cellpadding="5" cellspacing="0" style="margin-top: 15px;">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.name }}</td>
                <td>{{ student.email }}</td>
                <td>{{ student.department }}</td>
                <td>
                    <a href="{% url 'student_update' student.id %}">Edit</a> | 
                    <a href="{% url 'student_delete' student.id %}">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No student records found in the system database.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
