<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Student</title>
</head>
<body>
    <h2>{% if student %}Edit Student Details{% else %}Add New Student{% endif %}</h2>
    <form method="POST">
        {% csrf_token %}
        <label>Name:</label><br>
        <input type="text" name="name" value="{{ student.name }}" required><br><br>
        
        <label>Email:</label><br>
        <input type="email" name="email" value="{{ student.email }}" required><br><br>
        
        <label>Department:</label><br>
        <input type="text" name="department" value="{{ student.department }}" required><br><br>
        
        <button type="submit">Save Student Record</button>
    </form>
    <br>
    <a href="{% url 'student_list' %}">Back to Dashboard</a>
</body>
</html>
